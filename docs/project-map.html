<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1d2433; --muted:#5d667a; --line:#d9deea;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 22px rgba(20,30,60,.10);
  --done:#1f9d63; --doing:#d98a00; --todo:#7b8499; --paused:#5b7fd6;
  --track:#e6e9f2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151d; --card:#1b2030; --ink:#e8ebf4; --muted:#9aa3b8; --line:#2c3350;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    --done:#3fc48a; --doing:#f0b33a; --todo:#8f98ad; --paused:#7d9cf0; --track:#2a3148;
  }
}
:root[data-theme="dark"]{
  --bg:#12151d; --card:#1b2030; --ink:#e8ebf4; --muted:#9aa3b8; --line:#2c3350;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --done:#3fc48a; --doing:#f0b33a; --todo:#8f98ad; --paused:#7d9cf0; --track:#2a3148;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;line-height:1.8}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:1.5rem;margin:0}
.tagline{color:var(--muted);margin:2px 0 0}
.theme{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font:inherit}
button{font:inherit}
button:focus-visible,summary:focus-visible{outline:3px solid hsl(220 90% 60%);outline-offset:2px}
.hint{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:.92rem;margin-bottom:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;border-radius:999px;padding:1px 10px;border:1px solid currentColor}
.s-done{color:var(--done)} .s-doing{color:var(--doing)} .s-todo{color:var(--todo)} .s-paused{color:var(--paused)}

/* map */
.map{position:relative;aspect-ratio:16/10;min-height:430px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map line{stroke:var(--line);stroke-width:2;stroke-dasharray:5 6}
.center,.node{position:absolute;transform:translate(-50%,-50%);border:0;cursor:pointer;text-align:center;color:var(--ink)}
.center{left:50%;top:50%;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--done) calc(var(--p)*1%),var(--track) 0);padding:9px;box-shadow:var(--shadow)}
.center>span{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:var(--card);font-weight:700;padding:8px;line-height:1.4}
.center small{font-weight:400;color:var(--muted)}
.node{width:170px;padding:12px 10px;border-radius:18px;background:var(--card);
  border-top:5px solid hsl(var(--h) 70% 50%);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.node:hover,.node[aria-pressed="true"]{transform:translate(-50%,-50%) scale(1.06);box-shadow:0 10px 28px hsl(var(--h) 70% 40% / .28)}
.node .ic{font-size:1.5rem;display:block}
.node b{display:block;font-size:.98rem}
.node .pct{font-size:.8rem;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:hsl(var(--h) 70% 48%)}

/* panel */
.panel{margin-top:16px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;border-right:6px solid hsl(var(--h,220) 70% 50%)}
.panel h2{margin:0 0 4px;font-size:1.15rem}
.panel p{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:hsl(var(--h,220) 70% 50% / .13);color:var(--ink);border-radius:8px;padding:0 9px;font-size:.84rem;direction:ltr;unicode-bidi:isolate}
.go{background:hsl(var(--h,220) 70% 45%);color:#fff;border:0;border-radius:12px;padding:8px 18px;cursor:pointer;margin-top:8px}
.go:hover{filter:brightness(1.1)}

/* group view */
.back{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 14px;cursor:pointer;margin-bottom:12px}
.ghead{border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:16px 18px;border-top:6px solid hsl(var(--h) 70% 50%);margin-bottom:14px}
.ghead h2{margin:0;font-size:1.3rem}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
details.item{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border-right:5px solid hsl(var(--h) 70% 50%);padding:10px 14px}
details.item summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
details.item summary::-webkit-details-marker{display:none}
details.item summary b{font-size:1rem}
details.item .more{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.next{color:var(--muted);font-size:.9rem}
footer{margin-top:28px;color:var(--muted);font-size:.85rem;text-align:center}

@media (max-width:720px){
  .map{aspect-ratio:auto;min-height:0;display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:16px}
  .map svg{display:none}
  .center,.node{position:static;transform:none;width:auto}
  .center{align-self:center;width:150px;height:150px}
  .node:hover,.node[aria-pressed="true"]{transform:none}
  .items{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      "Graphify"
     ],
     "status": "done",
     "progress": 100,
     "next": ""
    }
   ]
  },
  {
   "id": "ai",
   "name": "ربات و هوش مصنوعی",
   "icon": "🤖",
   "hue": 190,
   "plain": "کاربردهای نمونه: ربات‌هایی که از کارت گرافیک نود استفاده می‌کنند.",
   "tech": [
    "Telegram",
    "Whisper",
    "Ollama"
   ],
   "items": [
    {
     "name": "ربات نمونهٔ صدا به متن",
     "plain": "یک ربات نمونه که پیام صوتی را به متن تبدیل می‌کند، به‌همراه راهنما برای ابزارهای هوش مصنوعی.",
     "tech": [
      "Whisper"
     ],
     "status": "doing",
     "progress": 60,
     "next": "اجرای واقعی با کارت گرافیک"
    },
    {
     "name": "سناریوی کامل ربات",
     "plain": "ربات تلگرام یا بله با چند ایجنت که روی نود کار می‌کنند.",
     "tech": [
      "Telegram",
      "Bale"
     ],
     "status": "doing",
     "progress": 40,
     "next": "فاز ۶ سناریو"
    },
    {
     "name": "مدل‌های آماده در میرور",
     "plain": "مدل‌های هوش مصنوعی از قبل در میرور ایران باشند. به تصمیم تو فعلاً اجرا نمی‌شود.",
     "tech": [
      "Ollama"
     ],
     "status": "paused",
     "progress": 0,
     "next": "فعلاً اجرا نشود"
    }
   ]
  }
 ]
}</script>
<script>
const D=JSON.parse(document.getElementById('pm-data').textContent);
const ST={done:['✓','تمام شده'],doing:['◐','در حال انجام'],todo:['○','شروع نشده'],paused:['⏸','فعلاً متوقف']};
function el(t,a={},...c){const e=document.createElement(t);for(const[k,v]of Object.entries(a)){
  if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}
  for(const x of c.flat()){if(x==null)continue;e.append(x&&x.nodeType?x:document.createTextNode(x));}return e;}
const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):0;
const gp=g=>avg(g.items.map(i=>i.progress));
const total=()=>avg(D.groups.flatMap(g=>g.items.map(i=>i.progress)));
const pill=s=>el('span',{class:'pill s-'+s},ST[s][0]+' '+ST[s][1]);
const chips=l=>el('div',{class:'chips'},(l||[]).map(t=>el('span',{class:'chip'},t)));
const hue=g=>'--h:'+g.hue;
const app=document.getElementById('app');
let selected=null;

document.getElementById('title').textContent=D.title;
document.getElementById('tagline').textContent=D.tagline||'';
document.title=D.title;
document.getElementById('foot').textContent='آخرین به‌روزرسانی: '+D.updated+' · درصدها تقریبی‌اند و از وضعیت کارها حساب شده‌اند.';

function renderMap(){
  app.replaceChildren();
  app.append(el('div',{class:'hint'},
    'روی هر دایره بزن تا توضیح ساده‌اش را ببینی، بعد دکمهٔ «ورود به زیربخش‌ها» را بزن.',
    el('div',{class:'legend'},Object.keys(ST).map(pill))));
  const n=D.groups.length, map=el('div',{class:'map'});
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('aria-hidden','true');
  const nodes=[];
  D.groups.forEach((g,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n, x=50+37*Math.cos(a), y=50+36*Math.sin(a);
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1','50%');ln.setAttribute('y1','50%');ln.setAttribute('x2',x+'%');ln.setAttribute('y2',y+'%');
    svg.append(ln);
    nodes.push(el('button',{class:'node',type:'button','aria-pressed':String(selected===g.id),
      style:hue(g)+';left:'+x+'%;top:'+y+'%',
      onclick:()=>{selected=g.id;renderMap();document.getElementById('panel').scrollIntoView({block:'nearest',behavior:'smooth'});}},
      el('span',{class:'ic','aria-hidden':'true'},g.icon||'●'),el('b',{},g.name),
      el('span',{class:'pct'},gp(g)+'٪'),el('div',{class:'bar'},el('i',{style:'width:'+gp(g)+'%'}))));
  });
  const c=el('button',{class:'center',type:'button',style:'--p:'+total(),
    onclick:()=>{selected='_about';renderMap();}},
    el('span',{},D.shortName||D.title,el('small',{},total()+'٪ کل پروژه')));
  map.append(svg,c,...nodes);app.append(map);
  const panel=el('div',{class:'panel',id:'panel'});
  if(selected==='_about'||!selected){
    panel.append(el('h2',{},'این پروژه چیست؟'),el('p',{},D.about||''),chips(D.tech));
  }else{
    const g=D.groups.find(x=>x.id===selected);
    panel.setAttribute('style',hue(g));
    panel.append(el('h2',{},g.icon+' '+g.name),el('p',{},g.plain),chips(g.tech),
      el('p',{class:'next'},g.items.length+' زیربخش · '+gp(g)+'٪ پیشرفت'),
      el('button',{class:'go',type:'button',onclick:()=>show(g.id)},'ورود به زیربخش‌ها ←'));
  }
  app.append(panel);
}
function renderGroup(g){
  app.replaceChildren();
  app.append(el('button',{class:'back',type:'button',onclick:()=>show(null)},'→ بازگشت به نقشه'));
  app.append(el('div',{class:'ghead',style:hue(g)},el('h2',{},g.icon+' '+g.name),el('p',{},g.plain),chips(g.tech),
    el('div',{class:'bar'},el('i',{style:'width:'+gp(g)+'%'}))));
  const wrap=el('div',{class:'items'});
  g.items.forEach(it=>{
    wrap.append(el('details',{class:'item',style:hue(g)},
      el('summary',{},el('b',{},it.name),el('span',{},pill(it.status),' ',it.progress+'٪')),
      el('div',{class:'more'},el('p',{},it.plain),chips(it.tech),
        el('div',{class:'bar'},el('i',{style:'width:'+it.progress+'%'})),
        it.next?el('p',{class:'next'},'قدم بعدی: '+it.next):null)));
  });
  app.append(wrap);window.scrollTo(0,0);
}
function show(id){
  try{location.hash=id?'#g-'+id:'';}catch(e){}
  const g=id&&D.groups.find(x=>x.id===id);
  g?renderGroup(g):renderMap();
}
function route(){const m=/^#g-(.+)$/.exec(location.hash);show(m?m[1]:null);}
addEventListener('hashchange',route);route();
document.getElementById('theme').addEventListener('click',()=>{
  const r=document.documentElement,dark=matchMedia('(prefers-color-scheme:dark)').matches;
  const cur=r.dataset.theme||(dark?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';
});
</script>
</body>
