{{define "login2fa.html"}}{{template "head" .}}
<form method="post" action="/panel/login/2fa" class="card" autocomplete="off">
<p>Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
<input type="hidden" name="token" value="{{.Data}}">
<label>Code <input name="code" required maxlength="16" inputmode="text" autocomplete="one-time-code" autofocus></label>
<button>Verify</button>
</form>
{{template "foot" .}}{{end}}
