# /etc/systemd/system/csbroker.service.d/10-docker-bridge.conf
# Only when csbroker listens on the Docker bridge gateway (e.g. http: 172.18.0.1:8088) because
# nginx runs in Docker: the bridge IP exists only after docker.service has created the network.
# Requires= (not just Wants=) so csbroker is stopped/restarted together with Docker.
# Restart=on-failure (main unit) covers the short window before the compose network is up.
[Unit]
After=docker.service
Requires=docker.service

[Service]
RestartSec=10s
