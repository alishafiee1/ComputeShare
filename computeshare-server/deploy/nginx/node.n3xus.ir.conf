# nginx server block for the public API of csbroker (path-filtered).
# Only the paths below reach csbroker; everything else gets 404 from nginx.
# Upstream: csbroker `http:` (example: nginx runs in Docker -> 172.18.0.1:8088).
# Replace the certificate paths with yours. Keep csbroker's trusted_proxies = nginx's network.
map $http_upgrade $cs_connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    http2 on;
    server_name node.n3xus.ir;

    ssl_certificate     /etc/nginx/certs/node.n3xus.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/node.n3xus.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    set $cs_upstream http://172.18.0.1:8088;

    # common proxy headers (X-Forwarded-For is REPLACED, never appended, so clients cannot spoof it)
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /healthz          { proxy_pass $cs_upstream; }
    location = /v1/register      { limit_except POST { deny all; } proxy_pass $cs_upstream; }
    location ^~ /v1/names/       { limit_except GET  { deny all; } proxy_pass $cs_upstream; }
    location = /v1/nodes         { limit_except GET  { deny all; } proxy_pass $cs_upstream; }
    location = /v1/version       { limit_except GET  { deny all; } proxy_pass $cs_upstream; }
    location = /v1/tunnel {
        proxy_pass $cs_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cs_connection_upgrade;
        # umbrella card 017: the tunnel is idle between pings, never let nginx close it for being quiet
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_buffering off;
    }
    # admin panel: only your own IPs. Two-step login exists now (csbroker admin 2fa enable); keep the IP list as a second lock. Replace 203.0.113.10 with your address.
    location ^~ /panel/          { allow 203.0.113.10; deny all; proxy_pass $cs_upstream; }
    # static mirror (optional, card 005/013): alias /srv/mirror/; autoindex off;
    # location ^~ /mirror/ { alias /srv/mirror/; }

    location / { return 404; }
}

# Port 80: do NOT add a second `server { listen 80; server_name node.n3xus.ir; }` if your nginx
# already has a :80 block (e.g. another site's) -- duplicate server_name on the same port is a conflict.
# Instead add `node.n3xus.ir` to that block's server_name. If there is no :80 block, use this one;
# it keeps the ACME HTTP-01 path for certbot --webroot and redirects everything else.
