# broker 005 R2: static files only — no CGI, no proxy_pass to code, no PHP.
# Include inside the broker's server{} (TLS terminated here too).
location = /install.sh { root /srv; default_type text/x-shellscript; }
location /mirror/ {
    alias /srv/mirror/;
    autoindex on;
    limit_except GET HEAD { deny all; }
    location ~ \.(php|cgi|pl|py|sh)$ { if ($uri !~ "^/mirror/csnode/") { return 403; } default_type application/octet-stream; }
    add_header X-Content-Type-Options nosniff;
    types { application/octet-stream gguf bin minisig; application/gzip gz; application/json json; }
}
